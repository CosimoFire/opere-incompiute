<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opere incompiute 2025 – dataviz Radar QN</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,700&display=swap">
<style>
  body { margin: 0; font-family: "Libre Franklin", Arial, sans-serif; color: #1a1a1a; background: #f7f8f9; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-family: "Newsreader", Georgia, serif; font-size: 32px; margin: 0 0 6px; }
  .intro { color: #6b6b6b; margin: 0 0 32px; }
  section { border-top: 1px solid #e3e3e3; padding: 24px 0; }
  h2 { font-size: 18px; margin: 0 0 4px; }
  .url { font-size: 13px; color: #6b6b6b; margin: 0 0 14px; word-break: break-all; }
  .prev { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  .prev figure { margin: 0; }
  .prev figcaption { font-size: 12px; color: #6b6b6b; margin-bottom: 4px; }
  .desk { width: 760px; max-width: 100%; }
  .mob { width: 375px; }
  iframe { width: 100%; border: 1px solid #e3e3e3; background: #f7f8f9; display: block; }
  .snip { margin-top: 14px; }
  textarea { width: 100%; height: 120px; font: 12px/1.4 ui-monospace, Consolas, monospace; border: 1px solid #e3e3e3; padding: 8px; box-sizing: border-box; }
  button { font: 600 13px "Libre Franklin", Arial, sans-serif; background: #1f4fd1; color: #fff; border: 0; border-radius: 2px; padding: 7px 14px; cursor: pointer; margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Opere pubbliche incompiute 2025</h1>
  <p class="intro">Dataviz Radar – QN sull'elenco-anagrafe delle opere incompiute (anno di riferimento 2025). Per ogni grafico: anteprima desktop e mobile e codice da incollare nel CMS (iframe + script, già pronto).</p>
  <div id="list"></div>
</div>
<script>
(function () {
  var BASE = "https://cosimofire.github.io/opere-incompiute/";
  var EMBED = '(function(){if(window.__radarQNv2)return;window.__radarQNv2=1;var O="https://cosimofire.github.io";var MQ=window.matchMedia("(prefers-color-scheme:dark)");function frames(){return Array.prototype.filter.call(document.getElementsByTagName("iframe"),function(f){return(f.getAttribute("src")||"").indexOf(O+"/")===0;});}function theme(){var t=document.documentElement.getAttribute("data-theme");return t==="dark"||t==="light"?t:(MQ.matches?"dark":"light");}function bgOf(el){for(;el&&el.nodeType===1;el=el.parentElement){var c=getComputedStyle(el).backgroundColor;if(c&&c !=="transparent"&&!/rgba\\([^)]*,\\s*0\\)$/.test(c))return c;}return null;}function send(f){try{f.contentWindow.postMessage({sentinel:"radar-qn",type:"theme",theme:theme(),bg:bgOf(f.parentElement)},O);}catch(e){}}function sendAll(){frames().forEach(send);}window.addEventListener("message",function(e){if(e.origin !==O)return;var d=e.data;if(!d||d.sentinel !=="radar-qn"||d.type !=="height")return;frames().forEach(function(f){if(f.contentWindow !==e.source)return;var h=Math.ceil(+d.height);if(h > 0&&20000 > h)f.style.height=h+"px";send(f);});});new MutationObserver(function(){sendAll();setTimeout(sendAll,400);}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});if(MQ.addEventListener)MQ.addEventListener("change",sendAll);})();';
  var VIZ = [
    { slug: "top10-importo", title: "Le 10 opere incompiute più costose", h: 840 },
    { slug: "treemap-stato", title: "Opere incompiute per stato dei lavori", h: 770 },
    { slug: "mappa-province", title: "Opere incompiute per provincia", h: 1120 }
  ];
  var list = document.getElementById("list");
  VIZ.forEach(function (v) {
    var url = BASE + v.slug + "/";
    var snippet = '<iframe src="' + url + '" width="100%" height="' + v.h + '" frameborder="0" scrolling="no" title="' + v.title + '"></iframe>\n<script>\n' + EMBED + '\n</' + 'script>';
    var s = document.createElement("section");
    s.innerHTML = '<h2></h2><p class="url"></p><div class="prev"><figure class="desk"><figcaption>Desktop</figcaption><iframe height="' + v.h + '"></iframe></figure>' +
      '<figure class="mob"><figcaption>Mobile (375 px)</figcaption><iframe height="' + Math.round(v.h * 1.3) + '"></iframe></figure></div>' +
      '<div class="snip"><textarea readonly></textarea><button type="button">Copia codice per il CMS</button></div>';
    s.querySelector("h2").textContent = v.title;
    s.querySelector(".url").textContent = url;
    s.querySelectorAll("iframe").forEach(function (f) { f.src = url; f.title = v.title; });
    s.querySelector("textarea").value = snippet;
    s.querySelector("button").addEventListener("click", function () {
      var b = this; navigator.clipboard.writeText(snippet).then(function () { b.textContent = "Copiato"; setTimeout(function () { b.textContent = "Copia codice per il CMS"; }, 1500); });
    });
    list.appendChild(s);
  });
  // le anteprime si adattano in altezza come nel CMS
  window.addEventListener("message", function (e) {
    var d = e.data; if (!d || d.sentinel !== "radar-qn" || d.type !== "height") return;
    document.querySelectorAll("iframe").forEach(function (f) { if (f.contentWindow === e.source) f.style.height = Math.ceil(d.height) + "px"; });
  });
})();
</script>
</body>
</html>
