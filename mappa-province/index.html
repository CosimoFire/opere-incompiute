<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opere incompiute per provincia – Radar QN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,700&display=swap">
<link rel="stylesheet" href="../assets/radar.css">
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<script src="../assets/radar.js"></script>
<style>
  .prov { stroke: var(--bg); stroke-width: 0.6px; stroke-linejoin: round; }
  .prov.is-on { stroke: var(--ink); stroke-width: 1.5px; }
  .reg { fill: none; stroke: var(--bg); stroke-width: 1.6px; pointer-events: none; }
  .hatch-line { stroke: var(--grey-4); stroke-width: 1.2px; }
  .hatch-bg { fill: var(--bg); }
  .sw--zero { background: var(--rule); }
  .ramp { display: inline-flex; align-items: flex-start; gap: 8px; margin-right: 6px; }
  .ramp__lab { line-height: 10px; }
  .ramp__box { position: relative; width: 150px; height: 26px; }
  .ramp__bar { position: absolute; left: 0; right: 0; top: 0; height: 10px; border-radius: 2px;
    background: linear-gradient(to right, var(--blue-5), var(--blue-4), var(--blue-3), var(--blue-2), var(--blue-1)); }
  .ramp__box b { position: absolute; top: 12px; transform: translateX(-50%); font-weight: 400; font-variant-numeric: tabular-nums; }
  .ramp__box b:first-of-type { transform: none; }
  .ramp__box b:last-of-type { transform: translateX(-100%); }
  .sw--nd { background: repeating-linear-gradient(135deg, var(--grey-4) 0 1.5px, var(--bg) 1.5px 4px); border: 1px solid var(--grey-4); }
</style>
</head>
<body>
<main class="radar">
  <header>
    <h1 class="r-title" id="title">Roma è la provincia con più incompiute</h1>
    <p class="r-sub">Opere pubbliche incompiute per provincia, anno di riferimento 2025. Comprese le opere delle amministrazioni centrali</p>
  </header>

  <div class="r-big" id="big" aria-hidden="true">
    <span class="r-big__num" id="big-num">&nbsp;</span>
    <span class="r-big__label" id="big-label"></span>
  </div>

  <figure class="r-chart" id="map">
    <div class="r-key" id="key" style="margin:0 0 8px"></div>
  </figure>

  <p class="r-note" id="nota"></p>

  <footer class="r-foot">
    <span>Fonte: MIT e Regioni, elenco-anagrafe delle opere incompiute 2025; confini ISTAT</span>
    <span>Elaborazione Radar – QN</span>
  </footer>
</main>

<script>
(function () {
  var R = Radar, fmt = R.fmt, f0 = function (v) { return fmt(v, 0); };
  // scala continua lineare da 1 al massimo, attraverso le cinque tonalità Radar (--blue-5 … --blue-1).
  // Il colore è mescolato in CSS (color-mix): resta legato alle variabili e segue da solo il tema chiaro/scuro.
  var MAX = 1;
  function fillFor(v) {
    var t = MAX > 1 ? (v - 1) / (MAX - 1) : 1;
    var pos = Math.max(0, Math.min(1, t)) * 4, i = Math.min(3, Math.floor(pos)), f = pos - i;
    return "color-mix(in oklab, var(--blue-" + (5 - i) + ") " + Math.round((1 - f) * 100) + "%, var(--blue-" + (4 - i) + "))";
  }

  Promise.all([d3.json("../data/province.topo.json"), R.loadCSV("../data/opere_province.csv")]).then(function (res) {
    var topo = res[0], rows = res[1];
    var by = {};
    rows.forEach(function (r) {
      by[r.sigla] = { sigla: r.sigla, nome: r.provincia, regione: r.regione, nd: r.disponibile === "no",
        n: R.num(r.opere), centrali: R.num(r.amm_centrali) || 0, comuni: r.comuni };
    });
    var fc = topojson.feature(topo, topo.objects.province);
    // d3 vuole gli anelli esterni in senso orario. Dopo la semplificazione alcune parti minuscole (isolette, exclavi)
    // restano rovesciate e "coprono il globo": si controlla e si rovescia ogni parte singolarmente.
    fc.features.forEach(function (f) {
      var g = f.geometry;
      var polys = g.type === "Polygon" ? [g.coordinates] : g.coordinates;
      polys.forEach(function (p) {
        if (d3.geoArea({ type: "Polygon", coordinates: p }) > 2 * Math.PI) p.forEach(function (r) { r.reverse(); });
      });
      f.d = by[f.properties.sigla];
    });
    // confini regionali: archi tra province di regioni diverse
    var regMesh = topojson.mesh(topo, topo.objects.province, function (a, b) { return a !== b && a.properties.regione !== b.properties.regione; });

    var vals = rows.filter(function (r) { return r.disponibile === "si"; });
    var conDati = vals.length;
    var conOpere = vals.filter(function (r) { return R.num(r.opere) > 0; }).length;
    var tot = d3.sum(vals, function (r) { return R.num(r.opere); });
    var ranked = vals.map(function (r) { return by[r.sigla]; }).sort(function (a, b) { return b.n - a.n; });
    var top = ranked[0], second = ranked[1];
    MAX = top.n;
    // il titolo dipende dai dati: si ricontrolla
    if (top.nome !== "Roma" || second.n === top.n) d3.select("#title").text("Le opere incompiute, provincia per provincia");

    var bigNum = d3.select("#big-num");
    d3.select("#big-label").text("province su " + f0(conDati) + " hanno almeno un'opera incompiuta nell'elenco 2025");
    if (R.reduced) bigNum.text(f0(conOpere));
    else { bigNum.text(f0(0)); R.onFirstView(document.getElementById("big"), function () { R.countUp(bigNum, conOpere, f0, "play"); }); }

    var nd = rows.filter(function (r) { return r.disponibile === "no"; }).map(function (r) { return r.regione; });
    nd = nd.filter(function (v, i) { return nd.indexOf(v) === i; }).map(function (v) { return v.split("/")[0]; });
    d3.select("#nota").text(
      "Ogni opera è attribuita alla provincia del comune indicato nell'elenco (codice ISTAT). " +
      "Il numero dipende da quanto gli enti dichiarano: chi non compila la scheda risulta senza opere incompiute. " +
      nd.join(" e ") + " non hanno pubblicato l'elenco 2025; la Provincia di Bolzano lo ha pubblicato vuoto. " +
      "Totale: " + f0(tot) + " opere.");

    // legenda: barra a gradiente con le tacche 1, metà e massimo, poi le due chiavi a parte
    var mid = Math.round((1 + MAX) / 2);
    d3.select("#key").html(
      '<span class="ramp"><span class="ramp__lab">Opere</span><span class="ramp__box"><i class="ramp__bar"></i>' +
      '<b style="left:0">1</b><b style="left:' + ((mid - 1) / (MAX - 1) * 100) + '%">' + mid + '</b><b style="left:100%">' + MAX + "</b></span></span>" +
      '<span><i class="sw sw--zero"></i>Nessuna</span><span><i class="sw sw--nd"></i>Dato non disponibile</span>');

    var host = document.getElementById("map");
    var tip = R.tooltip(host);
    var clear = function () {};
    R.dismissOutside(host, function () { tip.hide(); clear(); });

    R.responsive(host, function (W, phase) {
      var narrow = R.isNarrow(W);
      var H = Math.round(W * (narrow ? 1.18 : 0.98));
      var proj = d3.geoConicConformal().parallels([38, 46]).rotate([-12.5, 0]).fitExtent([[narrow ? 4 : 120, 8], [W - (narrow ? 4 : 40), H - 8]], fc);
      var path = d3.geoPath(proj);

      d3.select(host).select("svg").remove();
      var svg = d3.select(host).insert("svg", ".r-tip").attr("width", W).attr("height", H).attr("role", "img")
        .attr("aria-label", "Mappa delle province italiane colorate per numero di opere incompiute nel 2025. " + f0(conOpere) + " province su " + f0(conDati) +
          " ne hanno almeno una. Le più numerose: " + ranked.slice(0, 4).map(function (d) { return d.nome + " " + f0(d.n); }).join(", ") +
          ". Dato non disponibile per " + nd.join(" e ") + ".");
      svg.append("title").text("Opere incompiute per provincia, 2025");
      var defs = svg.append("defs");
      var pat = defs.append("pattern").attr("id", "hatch").attr("patternUnits", "userSpaceOnUse").attr("width", 4).attr("height", 4).attr("patternTransform", "rotate(45)");
      pat.append("rect").attr("class", "hatch-bg").attr("width", 4).attr("height", 4).style("fill", "var(--bg)");
      pat.append("line").attr("class", "hatch-line").attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", 4);

      var g = svg.append("g");
      var provs = g.selectAll("path").data(fc.features).join("path").attr("class", "prov mark").attr("d", path)
        .style("fill", function (f) {
          var d = f.d;
          if (!d || d.nd) return "url(#hatch)";
          return d.n > 0 ? fillFor(d.n) : "var(--rule)";
        });
      g.append("path").datum(regMesh).attr("class", "reg").attr("d", path);

      R.enter(provs, phase, function (s) { s.style("opacity", 0); },
        function (s) {   // in fase "static" arriva una selezione, non una transizione: niente delay
          (s.delay ? s.delay(function (f) { return (1 - (proj(d3.geoCentroid(f))[1] / H)) * 350; }) : s).style("opacity", 1);
        });

      // annotazioni (max 2): Roma e la seconda provincia
      var an = svg.append("g").attr("class", "anno");
      // testo ancorato a un punto nel mare (lon, lat); il tirante parte dal lato del testo rivolto alla provincia
      // (bordo superiore se il testo sta sotto, bordo inferiore se sta sopra) e arriva al centro della provincia
      function annotate(d, lonlat, lines) {
        var f = fc.features.find(function (q) { return q.properties.sigla === d.sigla; });
        var c = path.centroid(f), p = proj(lonlat);
        var t = an.append("text").attr("x", p[0]).attr("y", p[1]).attr("text-anchor", "middle");
        lines.forEach(function (l, i) {
          if (l) t.append("tspan").attr("x", p[0]).attr("dy", i ? 16 : 0).attr("class", i ? null : "em").text(l);
        });
        var bb = t.node().getBBox();
        var y0 = c[1] < bb.y ? bb.y - 3 : bb.y + bb.height + 3;   // testo sotto il punto: si parte dall'alto
        an.insert("path", "text").attr("d", "M" + p[0] + "," + y0 + "L" + c[0] + "," + c[1]);
        an.append("circle").attr("cx", c[0]).attr("cy", c[1]).attr("r", 2);
      }
      // Roma: nel Tirreno tra Sardegna e Campania. Palermo: nel mare subito a nord della provincia (tirante corto, verticale)
      var SEA = { RM: [11.7, 40.7], PA: [13.55, 38.62] };
      annotate(top, SEA[top.sigla] || [11.7, 40.7], [top.nome + ": " + f0(top.n) + " opere", narrow ? null : "la provincia con più opere"]);
      if (SEA[second.sigla]) annotate(second, SEA[second.sigla], [second.nome + ": " + f0(second.n)]);
      R.enter(an, phase, function (s) { s.style("opacity", 0); }, function (s) { s.style("opacity", 1); }, R.DUR * 0.8);

      clear = function () { provs.classed("is-dimmed", false).classed("is-on", false); };
      provs.style("cursor", "pointer")
        .on("pointerenter pointerdown", function (ev, f) {
          var d = f.d; if (!d) return;
          provs.classed("is-on", function (q) { return q === f; });
          d3.select(this).raise();
          var p = d3.pointer(ev, host);
          var rows2 = [["Regione", d.regione.split("/")[0]]];
          if (d.centrali > 0) rows2.push(["di cui amministrazioni centrali", f0(d.centrali)]);
          tip.show(R.tipHTML({
            title: d.nome + " (" + d.sigla + ")",
            value: d.nd ? "n.d." : f0(d.n), unit: d.nd ? "" : (d.n === 1 ? "opera" : "opere"),
            rows: rows2,
            note: d.nd ? "La regione non ha pubblicato l'elenco 2025" : (d.n > 0 ? "Comuni: " + d.comuni : (d.sigla === "BZ" ? "Elenco provinciale pubblicato vuoto" : null))
          }), p[0], p[1]);
        })
        .on("pointerleave", function (ev) { if (ev.pointerType === "mouse") { tip.hide(); clear(); } });
    });
  }).catch(function (e) { R.fail("#map", e); });
})();
</script>
</body>
</html>
